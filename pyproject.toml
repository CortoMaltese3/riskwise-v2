[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskwise-backend"
version = "2.0.0-dev"
description = "RISK WISE v2 Python backend (CLIMADA + FastAPI loopback engine)"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { file = "LICENSE" }

# Lean v2 runtime set. Kept packages only — every entry here must be
# justified against one of: (a) core CLIMADA compute path, (b) typed HTTP
# API (D02 / Area 5), (c) DuckDB scenario store (D03), (d) file formats
# used by seed data that cannot be replaced. See DECISIONS.md D05 and
# docs/architecture-decisions/adr-bundling.md for the rationale and for
# the removed-package list.
dependencies = [
    "climada==4.1.1",
    "geopandas>=0.14,<2",
    "numpy>=1.24,<2",
    "pandas>=2.0,<3",
    "shapely>=2.0,<3",
    "pycountry>=24.6",
    "openpyxl>=3.1,<4",
    "pyarrow>=15,<22",
    "h5py>=3.10,<4",
    "rasterio>=1.3,<2",
    "xlsxwriter>=3.2,<4",
    "duckdb>=1.0,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "psutil>=5.9,<7",
    "structlog>=24,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
bundle = [
    # Pinned ranges validated against Python 3.11 + CLIMADA 4.1.1.
    # Bumping either side requires re-running the build matrix in
    # docs/architecture-decisions/adr-bundling.md §5.
    "nuitka>=2.4,<3",
    "pyinstaller>=6.6,<7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# v1 handler code is slated for rewrite in v2 (see pytest ignore below).
# Excluding it here keeps ruff a pass on the maintained v2 surface without
# masking regressions in the code we actually care about.
extend-exclude = [
    "backend/base_handler.py",
    "backend/logger_config.py",
    "backend/dev.ipynb",
    "backend/costben",
    "backend/entity",
    "backend/exposure",
    "backend/hazard",
    # ``backend/impact/registry.py`` is the v2 data-driven impact-function
    # loader (issue #51) and is in scope for lint; only the legacy handler
    # and its untouched test stub stay out.
    "backend/impact/impact_handler.py",
    "backend/impact/test_impact_handler.py",
    "backend/macroeconomic",
    "backend/report",
    "backend/run_add_to_ouput.py",
    "backend/run_check_data_type.py",
    "backend/run_clear_temp_dir.py",
    "backend/run_export_report.py",
    "backend/run_fetch_cred_output.py",
    "backend/run_fetch_costbenefit.py",
    "backend/run_fetch_macro_chart_data.py",
    "backend/run_fetch_measures.py",
    "backend/run_fetch_reports.py",
    "backend/run_fetch_waterfall.py",
    "backend/run_remove_report.py",
    "backend/run_scenario.py",
    # Sphinx config, the FastAPI proof-of-concept under spike/, and the v1
    # translations utility script live outside the v2 backend surface and are
    # not part of the lint baseline.
    "docs/conf.py",
    "spike",
    "translations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["backend", "tests"]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
# Start permissive: this is the baseline for a codebase that has never
# been type-checked. Tighten (disallow_untyped_defs, strict) once the v2
# handlers land and the legacy surface below shrinks.
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

# Legacy v1 handlers, runner scripts, and pre-v2 backend entry points are
# skipped pending rewrite; same scope as the ruff exclude list above.
# `ignore_errors` is used instead of `exclude` because mypy ignores
# `exclude` when paths are passed on the CLI, which is what the pre-commit
# and CI invocations do.
[[tool.mypy.overrides]]
module = [
    "backend.app",
    "backend.base_handler",
    "backend.logger_config",
    "backend.test_app",
    "backend.test_logging_config",
    "backend.costben.*",
    "backend.entity.*",
    "backend.exposure.*",
    "backend.hazard.*",
    "backend.impact.impact_handler",
    "backend.impact.test_impact_handler",
    "backend.macroeconomic.*",
    "backend.report.*",
    "backend.run_add_to_ouput",
    "backend.run_check_data_type",
    "backend.run_clear_temp_dir",
    "backend.run_export_report",
    "backend.run_fetch_cred_output",
    "backend.run_fetch_costbenefit",
    "backend.run_fetch_macro_chart_data",
    "backend.run_fetch_measures",
    "backend.run_fetch_reports",
    "backend.run_fetch_waterfall",
    "backend.run_remove_report",
    "backend.run_scenario",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests", "backend"]
pythonpath = ["backend"]
# v1 handler tests (backend/{exposure,hazard,impact,entity,report}/test_*.py) import
# CLIMADA at module top and have never been wired into a runnable harness.
# Re-enabling them is out of scope for #14; skip collection so `pytest` is green.
addopts = ["--ignore-glob=backend/*/test_*.py"]
