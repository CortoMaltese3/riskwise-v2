[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskwise-backend"
version = "2.0.0-dev"
description = "RISK WISE v2 Python backend (climate-lama-engine + FastAPI loopback engine)"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { file = "LICENSE" }

# Lean v2 runtime set. Kept packages only — every entry here must be
# justified against one of: (a) climate-lama-engine compute path, (b) typed HTTP
# API (D02 / Area 5), (c) DuckDB scenario store (D03), (d) file formats
# used by seed data that cannot be replaced. See DECISIONS.md D05 and
# docs/spikes/adr-bundling.md for the rationale and for
# the removed-package list.
dependencies = [
    # Engine compute layer (DECISIONS.md D26 / adr-climate-lama-engine-adoption.md).
    # Hard-pinned per ADR §5.1 rule 5; requirements/requirements.txt and
    # requirements/environment.yml must match. Only backend/engine/adapter.py
    # may import from this package — enforced by scripts/check_engine_imports.py.
    "climate-lama-engine==0.4.0",
    "geopandas>=0.14,<2",
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "shapely>=2.0,<3",
    "pycountry>=24.6",
    "openpyxl>=3.1,<4",
    "pyarrow>=15,<25",
    "h5py>=3.10,<4",
    "rasterio>=1.3,<2",
    "duckdb>=1.0,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "psutil>=5.9,<8",
    "structlog>=24,<26",
    # Backend crash reporting + log breadcrumbs (issue #308). Init is a
    # no-op when SENTRY_DSN is absent (Electron only forwards the DSN to
    # the spawned Python process when the user has opted in), so the SDK
    # is dormant for forked / dev builds.
    "sentry-sdk>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
bundle = [
    # Pinned ranges validated against Python 3.12 + climate-lama-engine 0.4.0.
    # Bumping either side requires re-running the build matrix in
    # docs/spikes/adr-bundling.md §5.
    "nuitka>=2.4,<5",
    # Nuitka ≥ 2.x resolves its own module graph via ordered-set; keep it
    # as an explicit bundle dep so a slim CI env does not fall back to
    # Nuitka's ``set``-based path that changes ordering across runs.
    "ordered-set>=4,<5",
    # PyInstaller was retained through Phase 0 as the fallback bundler /
    # comparison baseline (see docs/spikes/adr-bundling.md §5). The release
    # pipeline ships Nuitka only, so the dependency was dropped — the ADR
    # records how to re-add it if Nuitka ever regresses on a dep bump.
]

[tool.ruff]
line-length = 100
target-version = "py311"
# v1 handler code is slated for rewrite in v2 (see pytest ignore below).
# Excluding it here keeps ruff a pass on the maintained v2 surface without
# masking regressions in the code we actually care about.
extend-exclude = [
    "backend/dev.ipynb",
    "backend/costben",
    "backend/entity",
    "backend/exposure",
    "backend/hazard",
    # ``backend/impact/registry.py`` is the v2 data-driven impact-function
    # loader (issue #51) and is in scope for lint; only the legacy handler
    # stays out.
    "backend/impact/impact_handler.py",
    "backend/macroeconomic",
    # The FastAPI proof-of-concept under spike/ and the v1 translations
    # utility script live outside the v2 backend surface and are not
    # part of the lint baseline.
    "spike",
    "translations",
]

[tool.ruff.lint]
# ``NPY002`` enforces the scientific-reproducibility rule from issue #55:
# no ``np.random.<global>`` calls. Analysts must derive a Generator via
# ``np.random.default_rng(seed)`` so every stochastic step inherits the
# scenario's stored seed.
select = ["E", "F", "I", "W", "B", "UP", "NPY002"]

[tool.mypy]
python_version = "3.11"
files = ["backend", "tests"]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
# Start permissive: this is the baseline for a codebase that has never
# been type-checked. Tighten (disallow_untyped_defs, strict) once the v2
# handlers land and the legacy surface below shrinks.
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

# Legacy v1 handlers, runner scripts, and pre-v2 backend entry points are
# skipped pending rewrite; same scope as the ruff exclude list above.
# `ignore_errors` is used instead of `exclude` because mypy ignores
# `exclude` when paths are passed on the CLI, which is what the pre-commit
# and CI invocations do.
[[tool.mypy.overrides]]
module = [
    "backend.app",
    "backend.test_app",
    "backend.test_logging_config",
    "backend.costben.*",
    "backend.entity.*",
    "backend.exposure.*",
    "backend.hazard.*",
    "backend.impact.impact_handler",
    "backend.macroeconomic.*",
    # Test modules whose latent type issues only became visible once
    # ``from backend.X`` imports started resolving (issue #195). Fixing the
    # underlying typing in test fixtures is out of scope for the
    # import-scheme refactor.
    "tests.unit.db.test_cache_store",
    "tests.unit.extensibility.test_custom_data_handler",
    "tests.unit.extensibility.test_namespace_isolation",
    "tests.unit.hazard.test_hazard_handler_engine",
    "tests.unit.impact.test_registry_load_happy_path",
    "tests.unit.models.test_costbenefit_payload",
    "tests.unit.models.test_waterfall_payload",
    "tests.unit.test_request_data_is_plain_dataclass",
    # Same rationale: type noise in test fixtures/stubs (engine handler
    # stubs, **kwargs cache-key calls, sentry transport reference, generator
    # fixture annotations) surfaced when CI's unpinned mypy drifted forward.
    # The production code these exercise is type-checked above.
    "tests.unit.test_run_scenario_measure_selection",
    "tests.unit.test_run_scenario_skipped_measures",
    "tests.unit.test_sentry_init",
    "tests.unit.test_cancellation",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests", "backend"]
# All in-repo imports are rooted at the ``backend`` package (issue #195),
# so pytest only needs the repo root on sys.path. Adding ``backend/`` here
# would let shallow ``from db import …`` reappear and break the boot path.
pythonpath = ["."]
