name: Release Windows
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Issue #252 — gate every release artifact on a green `tests.yml` run for
  # the PR that produced the tagged commit. Without this, `git push --tags`
  # on a known-failing main commit would still publish a signed installer.
  #
  # `tests.yml` only runs on `pull_request` events (see CI minutes budget),
  # so its run is keyed by the PR's head SHA — not the merge commit on main
  # the tag points at. We resolve the PR for the tag commit, then verify
  # the PR's tests.yml run concluded green. Direct pushes to main (no PR)
  # have no associated run and will fail this gate by design.
  # See CONTRIBUTING.md § Release gating.
  verify-tests:
    name: Verify tests.yml passed for tag's PR
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head SHA for tag commit
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Looking up PR associated with tag commit $TAG_SHA"
          pr=$(gh api "repos/${REPO}/commits/${TAG_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null) | {number, head_sha: .head.sha, merged_at}] | sort_by(.merged_at) | reverse | .[0] // empty')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "::error::No merged PR found for tag commit $TAG_SHA. Refusing to release a commit that did not pass tests.yml via a PR."
            exit 1
          fi
          pr_number=$(echo "$pr" | jq -r '.number')
          head_sha=$(echo "$pr" | jq -r '.head_sha')
          echo "Tag $TAG_SHA originated from PR #$pr_number (head $head_sha)"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check tests.yml conclusion for PR head SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          echo "Looking up tests.yml runs for PR head SHA $SHA"
          payload=$(gh api \
            "repos/${REPO}/actions/workflows/tests.yml/runs?head_sha=${SHA}&per_page=1" \
            --jq '{count: (.workflow_runs | length), status: (.workflow_runs[0].status // "missing"), conclusion: (.workflow_runs[0].conclusion // "missing"), url: (.workflow_runs[0].html_url // "")}')
          echo "tests.yml lookup: $payload"
          count=$(echo "$payload" | jq -r '.count')
          status=$(echo "$payload" | jq -r '.status')
          conclusion=$(echo "$payload" | jq -r '.conclusion')
          url=$(echo "$payload" | jq -r '.url')
          if [ "$count" = "0" ]; then
            echo "::error::No tests.yml run found for PR head SHA $SHA. Refusing to release an untested commit."
            exit 1
          fi
          if [ "$status" != "completed" ]; then
            echo "::error::tests.yml run for $SHA is still '$status' (not completed). Wait for it to finish before tagging. Run: $url"
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::tests.yml run for $SHA concluded '$conclusion' (expected 'success'). Refusing to release. Run: $url"
            exit 1
          fi
          echo "tests.yml passed for $SHA — release may proceed."

  build:
    needs: verify-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Derive the release channel from the tag so electron-builder knows
      # which channel file (`latest.yml` / `beta.yml` / `internal.yml`) to
      # publish. See ARCHITECTURE.md § Area 13.
      #   v2.0.1          → stable
      #   v2.0.1-beta.1   → beta
      #   v2.0.1-internal → internal
      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            *-beta.*)     channel="beta"     ;;
            *-internal.*) channel="internal" ;;
            *)            channel="stable"   ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "Resolved channel: $channel (tag=$tag)"

      - run: npm run build

      # Signing activates only when Azure Trusted Signing credentials are
      # present (AZURE_CLIENT_ID is the probe). Cert-less runs (forks, PR
      # builds) fall through to the unsigned branch so the release pipeline
      # keeps working until the Azure account is provisioned. See docs/reference/signing.md.
      # The `-c.publish.channel=` override routes the build's `latest*.yml`
      # and installer to the correct channel resolved above.
      - name: Build and publish
        shell: bash
        run: |
          builder_channel="latest"
          if [ "$RELEASE_CHANNEL" != "stable" ]; then
            builder_channel="$RELEASE_CHANNEL"
          fi
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "AZURE_CLIENT_ID present — producing Azure Trusted Signing build (channel=$builder_channel)"
            npx electron-builder -w --publish always -c.publish.channel="$builder_channel"
          else
            echo "AZURE_CLIENT_ID empty — producing unsigned build (channel=$builder_channel)"
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder -w --publish always -c.publish.channel="$builder_channel"
          fi
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}

  # Phase 4 Area 4 — bundle the Python engine with Nuitka on every `v*`
  # tag and attach the resulting .exe as a release artifact. Runs
  # independently of the Electron build; shipping the engine separately
  # keeps a failed Nuitka build from blocking a signed installer when the
  # engine is already cut from an earlier tag (see ADR adr-bundling.md).
  build-engine:
    name: Build Python engine (Nuitka)
    needs: verify-tests
    runs-on: windows-latest
    outputs:
      engine_sha256: ${{ steps.engine_hash.outputs.sha256 }}
      engine_version: ${{ steps.engine_hash.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install from lock file (with bundle extra)
        run: uv sync --extra bundle --frozen

      # build_engine.ps1 embeds a guarded Azure Trusted Signing step that
      # only runs when AZURE_CLIENT_ID is set. Forked PRs without secrets
      # produce an unsigned engine binary and skip signing cleanly.
      - name: Build engine
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
        run: |
          . .venv/Scripts/Activate.ps1
          ./scripts/build_engine.ps1

      - name: Compute engine SHA-256
        id: engine_hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/nuitka/riskwise-engine.exe).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=${env:GITHUB_REF_NAME}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "engine sha256=$hash"

      - name: Upload engine artifact
        uses: actions/upload-artifact@v7
        with:
          name: riskwise-engine
          path: dist/nuitka/riskwise-engine.exe
          if-no-files-found: error

      - name: Attach engine to release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" dist/nuitka/riskwise-engine.exe --clobber

  # Phase 4 Area 13 — build, sign, and publish engine-manifest.json. The
  # private key lives in `ENGINE_MANIFEST_KEY` (base64 of
  # engine-manifest.key) plus `ENGINE_MANIFEST_KEY_PASSWORD`. The app
  # bundles the public half in `resources/engine-manifest.pub` and refuses
  # to trust the manifest SHA-256 until the signature verifies locally.
  sign-engine-manifest:
    name: Sign engine manifest (minisign)
    runs-on: windows-latest
    needs: build-engine
    if: ${{ needs.build-engine.outputs.engine_sha256 != '' }}
    environment: release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install minisign (scoop)
        shell: pwsh
        run: |
          iwr -useb get.scoop.sh | iex
          scoop install minisign

      - name: Restore minisign private key
        shell: pwsh
        env:
          ENGINE_MANIFEST_KEY: ${{ secrets.ENGINE_MANIFEST_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ENGINE_MANIFEST_KEY)) {
            throw "ENGINE_MANIFEST_KEY secret is not set — cannot sign engine manifest"
          }
          $bytes = [Convert]::FromBase64String($env:ENGINE_MANIFEST_KEY)
          [IO.File]::WriteAllBytes("engine-manifest.key", $bytes)

      - name: Generate engine manifest
        shell: pwsh
        env:
          ENGINE_SHA256: ${{ needs.build-engine.outputs.engine_sha256 }}
          ENGINE_VERSION: ${{ needs.build-engine.outputs.engine_version }}
        run: |
          $manifest = [ordered]@{
            version          = $env:ENGINE_VERSION
            sha256           = $env:ENGINE_SHA256
            download_url     = "https://github.com/${{ github.repository }}/releases/download/$($env:ENGINE_VERSION)/riskwise-engine.exe"
            min_app_version  = $env:ENGINE_VERSION
            max_app_version  = $env:ENGINE_VERSION
            signature        = ""
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          Set-Content -Path "engine-manifest.json" -Value $json -Encoding UTF8
          Write-Host "Generated engine-manifest.json:"
          Get-Content engine-manifest.json

      - name: Sign engine manifest
        shell: pwsh
        env:
          ENGINE_MANIFEST_KEY_PASSWORD: ${{ secrets.ENGINE_MANIFEST_KEY_PASSWORD }}
        run: |
          ./scripts/sign_manifest.ps1 `
            -Manifest engine-manifest.json `
            -PrivateKey engine-manifest.key `
            -Password $env:ENGINE_MANIFEST_KEY_PASSWORD
          Remove-Item -Path engine-manifest.key -Force

      - name: Attach signed manifest to release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" engine-manifest.json --clobber

  # Phase 4 Area 18 — emit a CycloneDX SBOM covering both the npm and pip
  # dependency trees, attach it to the GitHub release, and verify that the
  # checked-in NOTICES.txt still matches the SBOM-derived attribution. The
  # job runs on Ubuntu so it can install both ecosystems' CycloneDX
  # generators without dragging the Windows installer toolchain in.
  sbom:
    name: Generate SBOM and verify NOTICES.txt
    needs: verify-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Install CycloneDX generators
        run: |
          npm install --no-save @cyclonedx/cyclonedx-npm@^1.19.0
          python -m pip install --upgrade pip
          python -m pip install "cyclonedx-bom>=4.4,<6"

      - name: Generate npm SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --spec-version 1.5 --output-format JSON --output-file sbom-npm.json

      - name: Generate pip SBOM
        run: cyclonedx-py environment --spec-version 1.5 --outfile sbom-pip.json

      - name: Merge SBOMs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          npm = json.loads(Path("sbom-npm.json").read_text(encoding="utf-8"))
          pip = json.loads(Path("sbom-pip.json").read_text(encoding="utf-8"))

          merged = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "application",
                      "name": "riskwise",
                      "version": "${{ github.ref_name }}",
                  }
              },
              "components": (npm.get("components") or []) + (pip.get("components") or []),
          }
          Path("sbom.json").write_text(json.dumps(merged, indent=2), encoding="utf-8")
          print(f"merged sbom: {len(merged['components'])} components")
          PY

      - name: Verify NOTICES.txt is up to date
        run: python scripts/generate_notices.py --sbom sbom.json --check

      - name: Attach SBOM to release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" sbom.json --clobber
