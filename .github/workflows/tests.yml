name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Minimal set to run the v2 unit suite. CLIMADA and geopandas are
      # stubbed in tests/unit/conftest.py so we can skip the heavy
      # geospatial install in CI (see pyproject.toml and tests/unit/ for
      # scope). Full-stack integration tests will get their own job.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pandas>=2.0,<3" \
            "numpy>=1.24,<2" \
            "pycountry>=24.6" \
            "fastapi>=0.110,<1" \
            "uvicorn[standard]>=0.27,<1" \
            "structlog>=24,<26" \
            "psutil>=5.9,<7" \
            "pytest>=8" \
            "httpx>=0.27"

      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # --legacy-peer-deps: `eslint@10` and `eslint-plugin-react@7.37.5` have
      # a peer-range conflict (plugin caps at eslint ^9.7). The lint setup is
      # untouched by #14; resolving that conflict is its own task. Vitest
      # itself does not depend on either, so running the test step this way
      # is safe.
      - run: npm ci --legacy-peer-deps

      - run: npm test
