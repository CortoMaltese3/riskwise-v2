# On-demand CI — this workflow no longer runs automatically on every PR.
# GitHub Actions minutes bill per-job with a 1-minute floor, so run
# *frequency* is the cost driver; runs are now rare and deliberate.
# Two ways to run it:
#   1. Dispatch: `gh workflow run tests.yml --ref main` — the phase gate and
#      the mandatory pre-tag gate (run it on the exact commit you will tag).
#   2. Per-PR opt-in: add the `ci` label to the PR. Adding any OTHER label
#      also fires the trigger, but every job's guard skips it — a skipped
#      run costs 0 billed minutes.
name: Tests

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # Phase 4 Area 18: tests/unit/test_pack_verifier.py exercises the real
      # minisign binary so a tampered .riskwise-pack actually fails the
      # signature check. Installing minisign here keeps the test from being
      # silently skipped on CI (the test module is `pytest.skipif`-guarded
      # so dev boxes without minisign still run a green pytest).
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      # Minimal set to run the v2 unit suite. CLIMADA and geopandas are
      # stubbed in tests/unit/conftest.py so we can skip the heavy
      # geospatial install in CI (see pyproject.toml and tests/unit/ for
      # scope). h5py, rasterio, pyproj and scipy are included because the
      # engine raster/loader modules import them at module level — without
      # them pytest fails at collection time (issue #207 follow-up). All
      # ship binary wheels (rasterio bundles its own GDAL) so no system
      # packages are needed. Full-stack integration tests will get their
      # own job.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pandas>=2.0,<3" \
            "numpy>=1.24,<2" \
            "pycountry>=24.6" \
            "fastapi>=0.110,<1" \
            "uvicorn[standard]>=0.27,<1" \
            "structlog>=24,<26" \
            "psutil>=5.9,<7" \
            "duckdb>=1.0,<2" \
            "openpyxl>=3.1,<4" \
            "h5py>=3.10,<4" \
            "rasterio>=1.3,<2" \
            "pyproj>=3.6,<4" \
            "scipy>=1.11,<2" \
            "pytest>=8" \
            "httpx>=0.27" \
            "ruff>=0.5" \
            "mypy==2.1.0" \
            "pyarrow>=12" \
            "climate-lama-engine==0.4.0"

      - name: Ruff lint
        run: ruff check .

      # Phase 6 Track 1 (issue #151 / DECISIONS.md D26): the only place
      # `climate_lama_engine` may be imported is `backend/engine/`. The
      # adapter is the single boundary so we have one fix point when the
      # engine API drifts. See adr-climate-lama-engine-adoption.md §5.1
      # rule 1 for the contract.
      - name: Engine import boundary
        run: python scripts/check_engine_imports.py

      # Issue #195: every in-repo import must be rooted at the ``backend``
      # package. Shallow ``from db import …`` style only resolves when
      # ``backend/`` itself is on ``sys.path`` and silently breaks the
      # ``python -m backend`` boot path.
      - name: Backend import scheme
        run: python scripts/check_backend_imports.py

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: Run pytest
        run: pytest -q

      # Issue #114: FastAPI integration tests exercise the real app via
      # TestClient against a freshly-migrated DuckDB. CLIMADA entrypoints
      # are monkey-patched per-test so we do not pay the geospatial
      # install cost, but the suite still needs to run against the
      # migrations and seeders the production lifespan invokes.
      - name: Run integration tests
        run: pytest -q tests/integration

      # Issue #55 Scenario 4: run the determinism fixture twice on the same
      # runner and gate the merge on bit-identical outputs. The in-test
      # assertions already compare the two computations; running the whole
      # file twice catches accidental state leakage between pytest
      # invocations (e.g. caches seeded by a previous ``pytest -q``).
      - name: Determinism smoke (run twice)
        env:
          RISKWISE_SKIP_MANIFEST_VERIFY: "1"
        run: |
          pytest -q tests/determinism
          pytest -q tests/determinism

  frontend:
    name: Frontend (eslint + prettier + vitest)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # Pre-existing issues the test-infra PR intentionally does not fix:
      #   1. package-lock.json is out of sync with package.json (added
      #      deps like openapi-typescript never hit the lockfile), so
      #      `npm ci` rejects the tree. Using `npm install` instead.
      # Electron's postinstall fails on UNC paths when invoked from WSL,
      # but works on Linux CI — so we don't pass --ignore-scripts here.
      - run: npm install --legacy-peer-deps --no-audit --no-fund

      - run: npm run lint

      - run: npm run format:check

      # Phase 4 Area 16 (issue #121): WCAG 2.1 AA contrast lint. Fails CI with
      # the failing token pair and measured ratio if a theme change drops a
      # text/background combination below the AA threshold.
      - run: npm run lint:contrast

      # Issue #123: keep en/ar/th locale files in lockstep before each release.
      # Fails the build if a key is added to en.json without a matching entry
      # in ar.json or th.json (or vice versa).
      - run: npm run lint:locales

      - run: npm test

  e2e:
    name: Electron E2E (Playwright)
    runs-on: ubuntu-latest
    # Disabled: Electron crashes consistently on the CI virtual framebuffer
    # (xvfb) before any tests run. Re-enable once the Electron app is stable
    # enough to produce a reliable signal (remove the `if: false` line and
    # restore the dependabot guard below).
    if: false
    # if: github.actor != 'dependabot[bot]'
    needs: [frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # The backend launcher the Electron main spawns imports the app
      # module and its runtime deps directly — install the minimal set
      # that satisfies lifespan startup without the CLIMADA tree.
      - name: Install backend runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.110,<1" \
            "uvicorn[standard]>=0.27,<1" \
            "duckdb>=1.0,<2" \
            "pandas>=2.0,<3" \
            "numpy>=1.24,<2" \
            "openpyxl>=3.1,<4" \
            "pycountry>=24.6" \
            "structlog>=24,<26" \
            "psutil>=5.9,<7" \
            "pyarrow>=12"

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Playwright system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build renderer + Electron main
        run: npm run build

      # Electron needs a display server on Linux; xvfb-run provides a
      # virtual framebuffer so the app can launch headlessly. Playwright
      # itself is headed by default for Electron — there is no
      # ``--headless`` flag we can pass to bypass this.
      - name: Run Playwright Electron suite
        run: xvfb-run --auto-servernum npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
