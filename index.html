<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="build/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RISK WISE</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="RISK WISE desktop application" />
    <!--
      Defense-in-depth CSP. The authoritative policy is injected at the
      network layer in public/electron.js (see CSP_DIRECTIVES) so a stripped
      meta tag still leaves the renderer locked down. Keep the two in sync
      when adding allowed sources. ``frame-ancestors`` is intentionally
      omitted here -- per the CSP spec it is only honoured when delivered as
      an HTTP header, and Chromium logs a warning if it appears in a meta
      tag. The header path in electron.js still applies it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        form-action 'none';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: file: http://127.0.0.1:* https://*.basemaps.cartocdn.com;
        font-src 'self' data:;
        connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* file:;
        worker-src 'self' blob:;
      "
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
