<!DOCTYPE html>
<!--
  Splash loader. The main process selects a theme via the URL hash
  (`loader.html#<theme>`) and the matching stylesheet is loaded from
  `loader-themes/<theme>/theme.css` by `loader.js`. The splash is intentionally
  branded and does NOT follow the user's saved `themeMode` preference (issue
  #289 audit): it appears before any React/MUI bundle initialises and
  represents the product, not the user's in-app theme choice. If a future
  product decision requires the splash to respect dark mode, the main process
  can read the persisted `themeMode` from electron-store and pass a different
  theme name through the URL hash — no change to this file is required.
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: file:;
      "
    />
    <title>RISK WISE</title>
    <script src="loader.js"></script>
  </head>
  <body>
    <div class="wordmark" id="wordmark"></div>
    <img class="mark" id="mark" alt="" />
    <div class="status" id="status"></div>
    <div class="version" id="version"></div>
  </body>
</html>
